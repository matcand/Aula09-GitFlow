name: PR Validation

on:
  pull_request:
  push:
    branches: [ main, develop, 'feature/**', 'hotfix/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Test
        run: mvn clean test -Dmaven.compiler.source=17 -Dmaven.compiler.target=17

      - name: Generate Javadoc
        run: mvn javadoc:javadoc -Dmaven.compiler.source=17 -Dmaven.compiler.target=17